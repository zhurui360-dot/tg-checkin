name: build

# 推 main 或打 tag 时构建镜像并推到 GHCR。
# NAS 那边用 watchtower 盯 latest 标签，有新镜像就自动重启容器——
# 所以「改代码 → push」就是一次发布，不需要登 NAS。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PR 只验证能不能构建，不推镜像
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 覆盖绝大多数 NAS；要跑 ARM 设备就加 linux/arm64
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR 新建的包默认私有，watchtower 没有凭据就拉不下来。
      # 这里直接改成 public，NAS 侧不用配 docker login 就能拉。
      - name: 公开镜像包
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${GITHUB_REPOSITORY#*/}"
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PKG}" \
            -f visibility=public \
            && echo "已设为 public: $PKG" \
            || echo "设置可见性失败，可稍后在 Packages 页面手动改为 public"