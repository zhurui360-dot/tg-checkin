name: keepalive

# 外部保活：由 GitHub 的服务器定时请求面板地址，制造真实入站流量。
# 容器内的自检线程在实例休眠后会一起停掉，无法唤醒自己，
# 因此平台按「无入站流量」休眠时必须依赖外部触发。
#
# 需要的仓库 Secret：
#   PANEL_URL   面板完整地址，例如 https://example.com  （会请求 /health）
# 可选：
#   PANEL_TOKEN 面板密码，配置后会额外验证登录态是否正常

on:
  schedule:
    # 每 10 分钟一次。GitHub 定时任务在高峰期可能延迟几分钟，
    # 但平台通常给 1 小时空闲窗口，余量足够。
    - cron: "*/10 * * * *"
  workflow_dispatch:

# 同一时间只跑一个，避免堆积
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping panel health endpoint
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: |
          set -u
          if [ -z "${PANEL_URL:-}" ]; then
            echo "未配置 PANEL_URL secret，跳过。"
            echo "请在仓库 Settings > Secrets and variables > Actions 添加 PANEL_URL。"
            exit 0
          fi

          BASE="${PANEL_URL%/}"
          case "$BASE" in
            http://*|https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          TARGET="$BASE/health"

          echo "请求 $TARGET"
          # 首次请求可能正在冷启动，给足超时并重试
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --max-time 60 --retry 2 --retry-delay 5 "$TARGET" 2>/dev/null || echo 000)
            echo "第 $i 次：HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json; echo
              break
            fi
            if [ "$i" -lt 5 ]; then sleep 20; fi
          done

          if [ "$CODE" != "200" ]; then
            echo "健康检查失败，最后一次状态码：$CODE"
            exit 1
          fi

          if [ -n "${PANEL_TOKEN:-}" ]; then
            echo "验证面板登录"
            JAR=$(mktemp)
            LOGIN=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -c "$JAR" -X POST "$BASE/api/panel/login" \
              -H 'Content-Type: application/json' \
              -d "$(printf '{"password":"%s"}' "$PANEL_TOKEN")" || echo 000)
            echo "登录状态码：$LOGIN"
            if [ "$LOGIN" != "200" ]; then
              echo "面板登录失败，请检查 PANEL_TOKEN 是否正确。"
              exit 1
            fi
            curl -sS --max-time 30 -b "$JAR" "$BASE/api/keepalive" || true
            echo
          fi
