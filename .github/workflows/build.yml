name: build

# push main 或打 tag 时构建镜像并推仓库。
# NAS 那边由 watchtower 盯 latest 标签，有新镜像就自动重建容器——
# 于是「改代码 → push」就是一次发布，不用登 NAS。
#
# 推两个仓库：
#   GHCR（默认，零配置，用 GITHUB_TOKEN）→ ghcr.io/<owner>/<repo>
#   Docker Hub（可选）→ docker.io/<user>/<repo>，配好 DOCKERHUB_USERNAME /
#     DOCKERHUB_TOKEN 两个 secret 后自动启用；没配就整段跳过。
#
# 三条踩过的坑，改动前先看：
#   1) 必须同时构建 amd64 + arm64。这台 NAS 是 ARM64，只推 amd64 的镜像
#      会拉取失败、或者拉下来 exec format error 直接 exit 255 无限重启。
#   2) 关掉 provenance / sbom。buildx 默认附带的 attestation manifest 会让
#      这台 NAS 的拉取器直接报 errno 52428803，连下载任务都不生成。
#   3) GHCR 包默认私有，必须 PATCH 成 public，否则 NAS 上匿名拉不到。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # buildx + qemu：qemu 用来在 x86 runner 上模拟编译 arm64 层
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # ---- 登录（PR 只验证构建，不登录也不推）----
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ---- 构建 + 推 GHCR ----
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 双架构：amd64 给常规机器，arm64 给这台 NAS
          platforms: linux/amd64,linux/arm64
          # 这两行是这台 NAS 能拉取的前提，别删
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 复制到 Docker Hub（不重新构建，直接搬 manifest list）----
      - name: 推 Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        run: |
          set -e
          SRC="${{ env.GHCR_IMAGE }}:latest"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | while read -r t; do
            [ -n "$t" ] || continue
            # 取 tag 后缀，映射到 Docker Hub 同名标签
            suffix="${t##*:}"
            dst="${{ env.DOCKERHUB_IMAGE }}:${suffix}"
            echo "复制 $SRC -> $dst"
            docker buildx imagetools create --tag "$dst" "$SRC"
          done

      - name: 把 GHCR 包设为 public
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          gh api --method PATCH "/user/packages/container/$PKG" -f visibility=public 2>/dev/null \
            || gh api --method PATCH "/orgs/$OWNER/packages/container/$PKG" -f visibility=public 2>/dev/null \
            || echo "包可见性设置失败（可能本来就是 public，或 token 权限不足）"
