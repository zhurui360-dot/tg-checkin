services:
  tg-checkin:
    build: .
    image: tg-checkin:latest
    container_name: tg-checkin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      # 模块：bot=只跑 AI 机器人 / checkin=只跑签到 / both=两者都要。
      # 留空则首次打开面板时弹「三选一」向导。填了就跳过向导，直连对应界面。
      MODULES: ${MODULES:-}
      # AI 机器人可选初始值，留空则用面板里配置的值
      BOT_TOKEN: ${BOT_TOKEN:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "${PANEL_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
